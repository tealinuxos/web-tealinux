version: '3.8'

# ============================================
# Network Configuration
# ============================================
# "proxy" = network external bersama Traefik (shared dengan ecoBite dll)
# "tealinux-network" = network internal khusus services TeaLinux
# ============================================
networks:
  proxy:
    external: true
  tealinux-network:
    driver: bridge

services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: tealinux-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-tealinux}
      POSTGRES_USER: ${DB_USER:-tealinux_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tealinux123}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - tealinux-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-tealinux_user} -d ${DB_NAME:-tealinux}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Go Backend API
  # ============================================
  backend:
    build:
      context: ./tealinuxbe
      dockerfile: Dockerfile
    container_name: tealinux-backend
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      # Database
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-tealinux_user}
      DB_PASSWORD: ${DB_PASSWORD:-tealinux123}
      DB_NAME: ${DB_NAME:-tealinux}
      DB_SSLMODE: disable
      # OAuth - Google
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-https://tealinuxos.org/api/auth/google/callback}
      # OAuth - GitHub
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_REDIRECT_URL: ${GITHUB_REDIRECT_URL:-https://tealinuxos.org/api/auth/github/callback}
      # JWT
      JWT_SECRET: ${JWT_SECRET:-supersecretkey}
      # Gin Mode
      GIN_MODE: release
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - proxy
      - tealinux-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"

      # --- HTTP ROUTER (Backend API) ---
      - "traefik.http.routers.tealinux-api.rule=Host(`tealinuxos.org`) && PathPrefix(`/api`)"
      - "traefik.http.routers.tealinux-api.entrypoints=web"
      - "traefik.http.routers.tealinux-api.middlewares=redirect-to-https"
      - "traefik.http.routers.tealinux-api.priority=2100"

      # --- HTTPS ROUTER (Backend API) ---
      - "traefik.http.routers.tealinux-api-sec.rule=Host(`tealinuxos.org`) && PathPrefix(`/api`)"
      - "traefik.http.routers.tealinux-api-sec.entrypoints=websecure"
      - "traefik.http.routers.tealinux-api-sec.tls=true"
      - "traefik.http.routers.tealinux-api-sec.tls.certresolver=letsencryptresolver"
      - "traefik.http.routers.tealinux-api-sec.priority=2100"

      # --- Strip /api prefix before sending to backend ---
      - "traefik.http.middlewares.tealinux-api-strip.stripprefix.prefixes=/api"
      - "traefik.http.routers.tealinux-api-sec.middlewares=tealinux-api-strip"

      # --- SERVICE ---
      - "traefik.http.routers.tealinux-api.service=tealinux-api-svc"
      - "traefik.http.routers.tealinux-api-sec.service=tealinux-api-svc"
      - "traefik.http.services.tealinux-api-svc.loadbalancer.server.port=3000"

  # ============================================
  # Astro Frontend (SSR)
  # ============================================
  frontend:
    build:
      context: ./tealinux-fe
      dockerfile: Dockerfile
    container_name: tealinux-frontend
    restart: unless-stopped
    expose:
      - "4321"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4321
      API_BASE_URL: http://backend:3000
    depends_on:
      - backend
    networks:
      - proxy
      - tealinux-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"

      # --- HTTP ROUTER (Frontend) ---
      - "traefik.http.routers.tealinux-web.rule=Host(`tealinuxos.org`)"
      - "traefik.http.routers.tealinux-web.entrypoints=web"
      - "traefik.http.routers.tealinux-web.middlewares=redirect-to-https"
      - "traefik.http.routers.tealinux-web.priority=2000"

      # --- HTTPS ROUTER (Frontend) ---
      - "traefik.http.routers.tealinux-web-sec.rule=Host(`tealinuxos.org`)"
      - "traefik.http.routers.tealinux-web-sec.entrypoints=websecure"
      - "traefik.http.routers.tealinux-web-sec.tls=true"
      - "traefik.http.routers.tealinux-web-sec.tls.certresolver=letsencryptresolver"
      - "traefik.http.routers.tealinux-web-sec.priority=2000"

      # --- SERVICE ---
      - "traefik.http.routers.tealinux-web.service=tealinux-web-svc"
      - "traefik.http.routers.tealinux-web-sec.service=tealinux-web-svc"
      - "traefik.http.services.tealinux-web-svc.loadbalancer.server.port=4321"

volumes:
  pgdata:
    driver: local
