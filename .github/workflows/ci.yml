# =============================================================================
# CI Pipeline - TealinuxOS Web
# Runs on every push and pull request to master
# =============================================================================
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  NODE_VERSION: "20"
  GO_VERSION: "1.25"

jobs:
  # ============================================
  # Frontend - Build & Lint (Astro SSR)
  # ============================================
  frontend-build:
    name:  Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tealinux-fe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: tealinux-fe/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Astro SSR
        run: npm run build
        env:
          NODE_ENV: production

  # ============================================
  # Backend - Build & Test (Go/Fiber)
  # ============================================
  backend-build:
    name: Backend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tealinuxbe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: tealinuxbe/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Build binary
        run: CGO_ENABLED=0 GOOS=linux go build -ldflags="-w -s" -o tealinux-api ./cmd/main.go

      - name: Run tests
        run: go test ./... -v -count=1 || echo "No tests found"

  # ============================================
  # Docker Build Verification
  # ============================================
  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: [frontend-build, backend-build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./tealinux-fe
          file: ./tealinux-fe/Dockerfile.prod
          push: false
          tags: tealinux-frontend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./tealinuxbe
          file: ./tealinuxbe/Dockerfile
          push: false
          tags: tealinux-backend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
