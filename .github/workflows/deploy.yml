# =============================================================================
# CD Pipeline - Deploy to Production VPS
# Runs only on push to master (after CI passes)
# =============================================================================
name: Deploy to Production

on:
  push:
    branches: [master]
  workflow_dispatch: # Allow manual trigger

# Prevent concurrent deployments
concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  # ============================================
  # Build & Push Docker Images to GHCR
  # ============================================
  build-and-push:
    name: 📦 Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      frontend_image: ${{ steps.meta-fe.outputs.tags }}
      backend_image: ${{ steps.meta-be.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Frontend Image ---
      - name: Frontend image metadata
        id: meta-fe
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/frontend
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build & Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./tealinux-fe
          file: ./tealinux-fe/Dockerfile.prod
          push: true
          tags: ${{ steps.meta-fe.outputs.tags }}
          labels: ${{ steps.meta-fe.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Backend Image ---
      - name: Backend image metadata
        id: meta-be
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/backend
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build & Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./tealinuxbe
          file: ./tealinuxbe/Dockerfile
          push: true
          tags: ${{ steps.meta-be.outputs.tags }}
          labels: ${{ steps.meta-be.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # Deploy to VPS via SSH
  # ============================================
  deploy:
    name:  Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e

            echo "Deploying TealinuxOS Web..."

            # Auto-detect docker compose command (V2 plugin vs V1 standalone)
            if docker compose version &>/dev/null; then
              DC="docker compose"
            elif docker-compose version &>/dev/null; then
              DC="docker-compose"
            else
              echo "ERROR: Neither 'docker compose' nor 'docker-compose' found!"
              exit 1
            fi
            echo "Using: $DC"

            # Navigate to project directory
            cd ${{ secrets.VPS_PROJECT_PATH || '/opt/web-tealinux' }}

            # Pull latest code
            git pull origin master

            # Login to GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull latest images
            $DC pull frontend backend 2>/dev/null || true

            # Rebuild and restart with zero-downtime
            $DC up -d --build --force-recreate frontend backend

            # Cleanup old images
            docker image prune -f

            # Health check - wait for services
            echo "Waiting for services to start..."
            sleep 10

            # Verify containers are running
            $DC ps

            echo "Deployment complete!"

      - name: Verify deployment
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            # Auto-detect docker compose command
            if docker compose version &>/dev/null; then
              DC="docker compose"
            elif docker-compose version &>/dev/null; then
              DC="docker-compose"
            else
              echo "ERROR: docker compose not found"
              exit 1
            fi

            cd ${{ secrets.VPS_PROJECT_PATH || '/opt/web-tealinux' }}

            # Check all containers are healthy (compatible with v1 and v2)
            RUNNING=$(docker ps --filter "label=com.docker.compose.project" --filter "status=running" -q | wc -l)
            TOTAL=$($DC ps -q | wc -l)

            if [ "$RUNNING" -ge "$TOTAL" ] && [ "$TOTAL" -gt 0 ]; then
              echo "All $TOTAL containers are running"
            else
              echo "Only $RUNNING/$TOTAL containers are running"
              $DC logs --tail=30
              exit 1
            fi
