version: "3.9"

# ============================================
# Development Docker Compose
# ============================================
# For local development with hot-reload

services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: tealinux-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: tealinux
      POSTGRES_USER: tealinux_user
      POSTGRES_PASSWORD: tealinux123
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    networks:
      - tealinux-dev
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U tealinux_user -d tealinux" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Go Backend API (Development)
  # ============================================
  backend:
    build:
      context: ./tealinuxbe
      dockerfile: Dockerfile.dev
    container_name: tealinux-backend-dev
    restart: unless-stopped
    env_file:
      - ./tealinuxbe/.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      GIN_MODE: debug
    ports:
      - "3000:3000"
    volumes:
      - ./tealinuxbe:/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tealinux-dev

  # ============================================
  # Astro Frontend (Development)
  # ============================================
  frontend:
    build:
      context: ./tealinux-fe
      dockerfile: Dockerfile.dev
    container_name: tealinux-frontend-dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 4321
      API_BASE_URL: http://backend:3000
    ports:
      - "4321:4321"
    volumes:
      - ./tealinux-fe:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - tealinux-dev

networks:
  tealinux-dev:
    driver: bridge

volumes:
  pgdata_dev:
