version: '3.8'

networks:
  proxy:
    external: true
  tealinux-network:
    driver: bridge

services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: tealinux-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tealinux_user
      POSTGRES_PASSWORD: dionmulmedabadi
      POSTGRES_DB: tealinux
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tealinux-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U tealinux_user -d tealinux" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Backend API (Go/Fiber)
  # ============================================
  backend:
    build:
      context: ./tealinuxbe
      dockerfile: Dockerfile
    container_name: tealinux-backend
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - ./tealinuxbe/.env.production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - proxy
      - tealinux-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.tealinux-api.rule=Host(`tealinuxos.org`) && PathPrefix(`/api`)"
      - "traefik.http.routers.tealinux-api.entrypoints=web"
      - "traefik.http.routers.tealinux-api.middlewares=redirect-to-https"
      - "traefik.http.routers.tealinux-api.priority=2100"
      - "traefik.http.routers.tealinux-api-sec.rule=Host(`tealinuxos.org`) && PathPrefix(`/api`)"
      - "traefik.http.routers.tealinux-api-sec.entrypoints=websecure"
      - "traefik.http.routers.tealinux-api-sec.tls=true"
      - "traefik.http.routers.tealinux-api-sec.tls.certresolver=letsencryptresolver"
      - "traefik.http.routers.tealinux-api-sec.priority=2100"
      - "traefik.http.routers.tealinux-api.service=tealinux-api-svc"
      - "traefik.http.routers.tealinux-api-sec.service=tealinux-api-svc"
      - "traefik.http.services.tealinux-api-svc.loadbalancer.server.port=3000"

  # ============================================
  # Frontend (Astro SSR)
  # ============================================
  frontend:
    build:
      context: ./tealinux-fe
      dockerfile: Dockerfile.prod
    container_name: tealinux-frontend
    restart: unless-stopped
    expose:
      - "4321"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "4321"
      BACKEND_URL: http://tealinux-backend:3000
    depends_on:
      - backend
    networks:
      - proxy
      - tealinux-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.tealinux-web.rule=Host(`tealinuxos.org`)"
      - "traefik.http.routers.tealinux-web.entrypoints=web"
      - "traefik.http.routers.tealinux-web.middlewares=redirect-to-https"
      - "traefik.http.routers.tealinux-web.priority=2000"
      - "traefik.http.routers.tealinux-web-sec.rule=Host(`tealinuxos.org`)"
      - "traefik.http.routers.tealinux-web-sec.entrypoints=websecure"
      - "traefik.http.routers.tealinux-web-sec.tls=true"
      - "traefik.http.routers.tealinux-web-sec.tls.certresolver=letsencryptresolver"
      - "traefik.http.routers.tealinux-web-sec.priority=2000"
      - "traefik.http.routers.tealinux-web.service=tealinux-web-svc"
      - "traefik.http.routers.tealinux-web-sec.service=tealinux-web-svc"
      - "traefik.http.services.tealinux-web-svc.loadbalancer.server.port=4321"

volumes:
  postgres_data:
    driver: local
