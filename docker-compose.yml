version: "3.9"

services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: tealinux-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-tealinux}
      POSTGRES_USER: ${DB_USER:-tealinux_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tealinux123}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - tealinux-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-tealinux_user} -d ${DB_NAME:-tealinux}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Go Backend API
  # ============================================
  backend:
    build:
      context: ./tealinuxbe
      dockerfile: Dockerfile
    container_name: tealinux-backend
    restart: always
    env_file:
      - ./tealinuxbe/.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tealinux-network

  # ============================================
  # Astro Frontend (SSR)
  # ============================================
  frontend:
    build:
      context: ./tealinux-fe
      dockerfile: Dockerfile
    container_name: tealinux-frontend
    restart: always
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4321
      API_BASE_URL: http://backend:3000
    ports:
      - "4321:4321"
    depends_on:
      - backend
    networks:
      - tealinux-network

  # ============================================
  # Nginx Reverse Proxy
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: tealinux-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
    networks:
      - tealinux-network

  # ============================================
  # Certbot (SSL auto-renewal)
  # ============================================
  certbot:
    image: certbot/certbot
    container_name: tealinux-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

networks:
  tealinux-network:
    driver: bridge

volumes:
  pgdata:
